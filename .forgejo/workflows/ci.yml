# CI for devTeam. Runs the full pytest suite — note that tests are colocated
# next to sources (agents/*/test_agent.py, daemon/**/test_*.py), not gathered
# under tests/, so a bare `pytest` from the repo root is the correct invocation.
# tests/ itself holds e2e scripts that need NATS and ollama; they are not run here.
#
# Runner label: `ubuntu-latest` is what a default Forgejo runner registers.
# If this instance registers different labels, change `runs-on` to match.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile (python:3.12-slim); pyproject allows >=3.11.
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Tests
        # 151 passing as of 2026-08-16.
        run: python -m pytest -q

      - name: Verify the container config still parses
        # config/docker.yaml is what the image actually runs; a typo here would
        # only surface at deploy time otherwise.
        run: |
          python -c "
          from daemon.config import parse_config
          cfg = parse_config('config/docker.yaml')
          assert cfg.api.effective_bind_address() == '0.0.0.0:4223', cfg.api
          assert cfg.api.address == 'localhost:4223', cfg.api
          assert not cfg.api.admin_api_key, 'no admin key may be baked into the image'
          print('config/docker.yaml OK')
          "

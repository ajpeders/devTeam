cluster:
  node_id: "local-dev"
  seeds: []

api:
  address: "localhost:4223"
  admin_api_key: "mydevteam-local-admin-key"

agents:
  - type: dev
    count: 1
    llm:
      primary:
        provider: ollama
        model: qwen3:8b
        endpoint: http://localhost:11434
      timeout: 120s
    max_memory_mb: 512
  - type: review
    count: 1
    llm:
      primary:
        provider: ollama
        model: qwen3:8b
        endpoint: http://localhost:11434
      timeout: 120s
    max_memory_mb: 256
  - type: qa
    count: 1
    llm:
      primary:
        provider: ollama
        model: qwen2.5:7b-instruct
        endpoint: http://localhost:11434
      timeout: 120s
  - type: deploy
    count: 1
    llm:
      primary:
        provider: ollama
        model: qwen2.5:7b-instruct
        endpoint: http://localhost:11434
      timeout: 120s

git:
  default_remote: "file:///home/alex/projects/MyDevTeam"
  workspace_dir: "/tmp/mydevteam-workspaces"

docker:
  registry: ""

deploy:
  method: "docker-compose"
  targets:
    - name: "local"
      host: "localhost"
      compose_file: "docker-compose.yml"
  default_target: "local"
